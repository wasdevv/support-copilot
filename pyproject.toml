[project]
name = "support-copilot"
version = "0.1.0"
description = "Customer-support copilot built as production LLM backend work, one stage at a time."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
